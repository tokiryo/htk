<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTK v1.1</title>
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
<style>
  :root { --bg: #f4f4f2; --panel: #fff; --ink: #1c1c1e; --muted: #6b6b70; --line: #d9d9d4; --accent: #2f6fdb; --view: #2b2c31; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1c1f; --panel: #25262a; --ink: #ececee; --muted: #9a9aa1; --line: #3a3b40; --accent: #6ea2ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; display: flex; height: 100vh; }
  aside { width: 340px; max-width: 45vw; overflow-y: auto; padding: 16px; background: var(--panel); border-right: 1px solid var(--line); }
  main { flex: 1; position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; background: var(--view); }
  #view canvas { display: block; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  h2 { font-size: 13px; margin: 16px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  label { display: grid; grid-template-columns: 70px 1fr 56px; align-items: center; gap: 8px; margin: 3px 0; font-size: 12px; }
  input.num { width: 100%; padding: 1px 2px; text-align: right; font: inherit; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  input.num:focus { outline: none; border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  label.check { display: flex; gap: 6px; grid-template-columns: none; margin: 6px 0; }
  .mouse { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 6px 0; }
  .mouse .head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; }
  .mouse .head small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .mouse .head button { padding: 0 8px; }
  #words details { margin: 4px 0; }
  details > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  #toolbar { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #toolbar button { background: rgba(37,38,42,.85); color: #ececee; border-color: #55575e; }
  #toolbar button.on { border-color: #6ea2ff; color: #6ea2ff; }
  #info { position: absolute; left: 12px; bottom: 12px; color: #c9c9ce; font-size: 12px; background: rgba(37,38,42,.7); padding: 4px 8px; border-radius: 6px; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #c9c9ce; background: var(--view); }
  @media (max-width: 700px) { body { flex-direction: column-reverse; } aside { width: 100%; max-width: none; height: 45vh; border-right: 0; border-top: 1px solid var(--line); } main { height: 55vh; flex: none; } }
</style>
</head>
<body>
<aside>
  <h1>HTK v1.1</h1>

  <label>t<input id="t" type="range" min="-0.5" max="1.5" step="0.01" value="0"><input id="t-o" class="num" type="number" step="0.01" min="-2" max="3"></label>
  <div class="sub">0：左右対称の平均 ／ 1：非対称（エルゴ）の平均</div>

  <label class="check"><input id="t-auto" type="checkbox" checked>t を自動（重ねたマウスに合わせる）</label>

  <h2>言葉の軸</h2>
  <div class="sub">−100 … +100。±50 が実在マウスのばらつき ±2 つ分（±2 SD）。軸を動かしても t は動きません。</div>
  <div id="words"></div>

  <h2>マウスを重ねる</h2>
  <div class="sub">+100 でそのマウス1体分。「形」は対称成分（t と主成分のずれ）、「左右」は非対称成分（遺伝子）です。何体でも重ねられます。</div>
  <div class="row"><select id="mouse-add"></select></div>
  <div id="mice"></div>

  <h2>エルゴ遺伝子モデル（左右のずれ）</h2>
  <div class="row">
    <select id="gene">
      <option value="">なし</option>
      <option value="model">エルゴ遺伝子の平均</option>
      <option value="pcs">エルゴ遺伝子の主成分</option>
    </select>
  </div>
  <label>強さ<input id="strength" type="range" min="0" max="1.5" step="0.05" value="1"><input id="strength-o" class="num" type="number" step="0.05" min="0" max="3"></label>
  <div id="gene-pcs"></div>

  <h2>形の主成分（σ）</h2>
  <div id="pcs"></div>

  <h2>操作</h2>
  <div class="row">
    <button id="reset">リセット</button>
    <button id="random">ランダム</button>
    <button id="save-json">CV を保存（JSON）</button>
    <button id="save-obj">曲面を保存（OBJ）</button>
  </div>
</aside>
<main>
  <div id="view"></div>
  <div id="toolbar">
    <button data-cam="iso" class="on">斜め</button><button data-cam="left">左</button><button data-cam="top">上</button>
    <button data-cam="front">前</button><button data-cam="rear">後</button>
    <button id="wire">ワイヤ</button><button id="zebra">ゼブラ</button>
  </div>
  <div id="info"></div>
  <div id="loading">読み込み中…</div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
